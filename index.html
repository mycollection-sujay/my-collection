<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Collection</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 12px; }
    input, button { font-size: 16px; padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    .item { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 10px 0; }
    .item img, .item video { max-width: 100%; border-radius: 6px; }
  </style>
</head>
<body>

<div id="loginView">
  <h2>My Collection</h2>
  <button id="loginBtn">Sign in with Google</button>
</div>

<div id="mainView" style="display:none">
  <button id="logoutBtn">Sign out</button>

  <h3>Search</h3>
  <input id="search" placeholder="Search by title or tag...">

  <h3>Add to collection</h3>
  <input id="title" placeholder="Title">
  <input id="tags" placeholder="Tags (comma separated)">
  <input id="file" type="file" accept="image/*,video/*,application/pdf,.doc,.docx,.txt">
  <button id="saveBtn">Save</button>
  <p id="status"></p>

  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAtz3T7gqeG8Zyh3KoJmjKzD0OHIPFy51s",
  authDomain: "my-collection-5af2a.firebaseapp.com",
  projectId: "my-collection-5af2a",
  appId: "1:99640410240:web:187fb6b08f062d4bcee665"
};

// Cloudinary settings
const CLOUD_NAME = "jpbeoe3d";
const UPLOAD_PRESET = "my_collection";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allItems = [];

document.getElementById("loginBtn").onclick = () =>
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(e.message));
document.getElementById("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  document.getElementById("loginView").style.display = user ? "none" : "block";
  document.getElementById("mainView").style.display = user ? "block" : "none";
  if (user) loadItems();
});

async function loadItems() {
  const snap = await getDocs(query(collection(db, "items"), orderBy("createdAt", "desc")));
  allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render(allItems);
}

function render(items) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    let media = "";
    if (item.type?.startsWith("image/")) media = `<img src="${item.url}">`;
    else if (item.type?.startsWith("video/")) media = `<video src="${item.url}" controls></video>`;
    else if (item.url) media = `<a href="${item.url}" target="_blank">Open file</a>`;
    div.innerHTML = `<strong>${item.title}</strong><br><small>${item.tags || ""}</small><br>${media}`;
    list.appendChild(div);
  });
}

document.getElementById("search").oninput = e => {
  const q = e.target.value.toLowerCase();
  render(allItems.filter(i =>
    (i.title || "").toLowerCase().includes(q) ||
    (i.tags || "").toLowerCase().includes(q)));
};

async function uploadToCloudinary(file) {
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
    method: "POST",
    body: form
  });
  if (!res.ok) throw new Error("Upload failed");
  const data = await res.json();
  return data.secure_url;
}

document.getElementById("saveBtn").onclick = async () => {
  const title = document.getElementById("title").value.trim();
  const tags = document.getElementById("tags").value.trim();
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  if (!title) return alert("Please enter a title");

  let url = "", type = "";
  try {
    if (file) {
      status.textContent = "Uploading...";
      url = await uploadToCloudinary(file);
      type = file.type;
    }
    status.textContent = "Saving...";
    await addDoc(collection(db, "items"), { title, tags, url, type, createdAt: serverTimestamp() });
    status.textContent = "Saved!";
    document.getElementById("title").value = "";
    document.getElementById("tags").value = "";
    document.getElementById("file").value = "";
    loadItems();
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
};
</script>
</body>
</html>
